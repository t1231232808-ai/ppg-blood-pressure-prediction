services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ppg-frontend:latest
    container_name: ppg-frontend
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ppg-backend:latest
    container_name: ppg-backend
    restart: always
    env_file:
      - ../backend/.env.production.example
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ../backend/app/static:/app/app/static
      - ../mock-data:/app/mock-data:ro
      - ../mock-data:/mock-data:ro
    depends_on:
      - mysql
      - redis
      - milvus

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bp_prediction
      MYSQL_USER: bp_user
      MYSQL_PASSWORD: bp_password
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=+08:00
    volumes:
      - ${MYSQL_DATA_DIR:-/data/mysql}:/var/lib/mysql
      - ./init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql:ro

  redis:
    image: redis:7.2
    container_name: redis
    restart: always
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "${ETCD_CLIENT_PORT:-2379}:2379"
      - "${ETCD_PEER_PORT:-2380}:2380"
    volumes:
      - ${MILVUS_ETCD_DATA_DIR:-/data/milvus/etcd}:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    restart: always
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${MILVUS_MINIO_DATA_DIR:-/data/milvus/minio}:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.1
    container_name: milvus-standalone
    restart: always
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: http://milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "${MILVUS_GRPC_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    depends_on:
      - etcd
      - minio

volumes:
  bp_mysql_data:

networks:
  default:
    name: milvus-net
